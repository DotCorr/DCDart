name: dcc
description: >
  The dcc CLI driver (ROADMAP.md M0). Plain hosted Dart bootstrap tooling,
  not DCDart itself -- see core/docs/decisions/0002-dcc-bootstrap-language.md.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

# Path deps only, added once the pipeline stopped being a stub -- see the
# addendum at the bottom of docs/decisions/0002-dcc-bootstrap-language.md.
# bin/dcc.dart still imports lib/ by relative path, not package: URI; these
# are lib/pipeline.dart's dependencies, one level in.
dependencies:
  dcc_lower:
    path: ../dcc-lower
  backend:
    path: ../backend
  dc_ir:
    path: ../dc-ir
