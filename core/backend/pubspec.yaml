name: backend
description: >
  DC-IR -> LLVM IR -> object file (DCDART_SPEC.md §1). Plain hosted Dart,
  see core/docs/decisions/0006-toolchain-bootstrap-language.md.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dc_ir:
    path: ../dc-ir

# Added for tests/ (ADR-0040). Same reasoning as dc-elide's pubspec: this
# package depends only on dc_ir, NOT on the vendored `kernel` package, so
# package:test resolves cleanly here where it cannot in dcc_lower.
dev_dependencies:
  test: ^1.24.0
